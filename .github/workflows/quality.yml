name: Documentation and Engine Checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate documentation references
        run: npm run validate:docs
      - name: Run framework tests
        run: npm test
      - name: Verify CLI help and diagnostics
        run: |
          node scripts/website-builder.js help
          node scripts/website-builder.js info
